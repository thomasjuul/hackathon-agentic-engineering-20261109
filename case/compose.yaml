services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop-local-only
      POSTGRES_DB: request_workshop
    ports:
      - "127.0.0.1:${WORKSHOP_POSTGRES_PORT:-54329}:5432"
    volumes:
      - workshop-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d request_workshop"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  workshop-data:
